<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FoF — Fish Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Fredoka',sans-serif; }
  body { width:390px; height:844px; overflow:hidden; position:relative; background:#2FB9EC; }

  /* ---- sand panel with wavy top edge ---- */
  .panel { position:absolute; top:150px; left:0; right:0; bottom:0;
           background:linear-gradient(180deg,#FFE9A8 0%,#FFD86B 40%,#FFC93C 100%);
           border-radius:46% 54% 0 0 / 34px 30px 0 0; }
  .panel::before { content:""; position:absolute; top:-22px; left:0; right:0; height:34px;
                   background:radial-gradient(circle at 20px -8px, transparent 22px, #FFE9A8 23px);
                   background-size:44px 34px; background-position:center; }

  /* ---- top HUD bar (shared pattern) ---- */
  .topbar { position:absolute; top:14px; left:10px; right:10px; z-index:5;
            display:flex; align-items:center; gap:7px; }
  .lvl-badge { width:44px; height:44px; flex:none;
               background:#2E9BDF; border:3.5px solid #fff; color:#fff;
               display:flex; align-items:center; justify-content:center;
               font-weight:700; font-size:19px;
               border-radius:38% 62% 55% 45% / 55% 45% 62% 38%;
               box-shadow:0 3px 0 rgba(0,60,110,.35);
               text-shadow:0 2px 0 rgba(0,0,0,.2); transform:rotate(-6deg); }
  .pill { position:relative; flex:1; height:34px; background:#fff; border-radius:20px;
          display:flex; align-items:center; padding-left:32px;
          font-weight:600; font-size:14.5px; color:#4A3B2A;
          box-shadow:0 3px 0 rgba(0,60,110,.22); }
  .pill .icon { position:absolute; left:-6px; top:50%; transform:translateY(-50%);
                width:32px; height:32px; border-radius:50%; }
  .icon.coin { background:radial-gradient(circle at 35% 30%,#FFE28A 0%,#FFC93C 55%,#F0A420 100%);
               border:2.5px solid #E08E00; box-shadow:0 2px 0 rgba(0,60,110,.25); }
  .icon.coin::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
                      width:14px; height:14px; border-radius:50%;
                      border:3px solid #E08E00; opacity:.55; }
  .icon.gem::before { content:""; position:absolute; inset:3px;
                      background:linear-gradient(135deg,#E08CFF 0%,#B05CE3 55%,#7E2FBF 100%);
                      clip-path:polygon(50% 0%,100% 35%,78% 100%,22% 100%,0% 35%); }
  .icon.energy { background:radial-gradient(circle at 35% 30%,#FFB03A 0%,#F08A1D 70%);
                 border:2.5px solid #C96A00; box-shadow:0 2px 0 rgba(0,60,110,.25); }
  .icon.energy::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
                        width:10px; height:16px;
                        background:#FFF3D6; clip-path:polygon(60% 0,20% 55%,45% 55%,40% 100%,80% 42%,55% 42%); }
  .plus { position:absolute; top:-7px; right:-4px; width:19px; height:19px;
          background:linear-gradient(180deg,#8FE05C,#4CAF2E); border:2.5px solid #fff;
          border-radius:50%; color:#fff; font-weight:700; font-size:13px;
          display:flex; align-items:center; justify-content:center;
          box-shadow:0 2px 0 rgba(0,60,110,.25); }
  .menu-btn { flex:none; width:46px; height:46px; border-radius:16px;
              background:linear-gradient(180deg,#FFB53E 0%,#FF8A3D 100%);
              border:3px solid #fff; box-shadow:0 4px 0 #D96A1E, 0 6px 8px rgba(0,60,110,.3);
              display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .menu-btn span { width:20px; height:4px; border-radius:3px; background:#fff; }

  /* ---- title ---- */
  .title { position:absolute; top:64px; left:0; right:0; z-index:4; text-align:center;
           font-weight:700; font-size:44px; line-height:.95; letter-spacing:1px;
           color:#F25CA2; -webkit-text-stroke:2.5px #fff;
           text-shadow:0 4px 0 #C93B82, 0 8px 10px rgba(120,30,80,.25); }

  /* ---- sections ---- */
  .section { position:relative; z-index:3; padding:0 14px; }
  .sec-head { display:flex; align-items:center; gap:12px; margin:14px 4px 10px;
              color:#8A5A1E; font-weight:700; font-size:20px; }
  .sec-head::before, .sec-head::after { content:""; flex:1; height:3px; border-radius:2px;
                                        background:rgba(255,255,255,.85); }

  .boosters { display:flex; justify-content:space-between; }
  .booster { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bowl { width:104px; height:84px; position:relative;
          background:radial-gradient(ellipse at 50% 20%,#FFFFFF 0%,#EAF7FF 60%);
          border-radius:50% 50% 46% 46% / 60% 60% 40% 40%;
          border:3px solid rgba(255,255,255,.9);
          box-shadow:inset 0 -22px 0 rgba(139,92,227,.35), 0 4px 0 rgba(138,90,30,.18);
          display:flex; align-items:center; justify-content:center; font-size:40px; }
  .timer { padding:3px 14px; border-radius:16px; background:#3B3B6B;
           color:#fff; font-weight:600; font-size:14.5px; letter-spacing:1px;
           box-shadow:0 3px 0 rgba(90,50,10,.25); }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .fcard { position:relative; background:#fff; border-radius:18px; padding:6px 6px 0;
           box-shadow:0 4px 0 rgba(138,90,30,.28); }
  .fcard .art { height:76px; border-radius:13px; display:flex; align-items:center;
                justify-content:center; font-size:38px;
                background:linear-gradient(180deg,#3FC6F0 0%,#1B9CD8 100%); }
  .fcard .stars { text-align:center; font-size:13px; letter-spacing:2px; padding:3px 0 2px;
                  color:#FFC93C; text-shadow:0 1px 0 #E08E00; }
  .fcard .foot { display:flex; align-items:center; gap:6px; padding:0 2px 8px; }
  .fcard .lvl { flex:none; width:24px; height:24px; border-radius:50%;
                background:linear-gradient(180deg,#5FD3F7,#1B9CD8);
                border:2.5px solid #fff; box-shadow:0 2px 0 rgba(0,80,140,.35);
                color:#fff; font-weight:700; font-size:13px;
                display:flex; align-items:center; justify-content:center; }
  .fcard .count { flex:1; height:20px; border-radius:12px; overflow:hidden;
                  display:flex; font-weight:700; font-size:12px; }
  .fcard .count b { flex:1.4; background:#fff; color:#4A3B2A;
                    display:flex; align-items:center; justify-content:center; }
  .fcard .count i { flex:1; background:#F5A623; font-style:normal; }
  .ribbon { position:absolute; top:-8px; right:-10px; padding:3px 10px;
            background:linear-gradient(180deg,#FF6B6B,#E23A3A); color:#fff;
            font-weight:700; font-size:11.5px; border-radius:6px 6px 6px 0;
            transform:rotate(4deg); box-shadow:0 2px 0 #B02020; z-index:2; }

  .locked .art { filter:grayscale(1) brightness(.75); background:#8A8F9E; }

  .close-btn { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:6;
               width:62px; height:62px; border-radius:50%;
               background:linear-gradient(180deg,#FF7B7B 0%,#E23A3A 100%);
               border:4px solid #fff; box-shadow:0 5px 0 #B02020, 0 8px 12px rgba(120,30,30,.3);
               display:flex; align-items:center; justify-content:center; }
  .close-btn svg { width:26px; height:26px; }
  .close-btn path { stroke:#fff; stroke-width:4; stroke-linecap:round; }
</style>
</head>
<body>
  <div class="panel"></div>

  <div class="topbar">
    <div class="lvl-badge">99</div>
    <div class="pill"><div class="icon coin"></div>999,999,999<div class="plus">+</div></div>
    <div class="pill"><div class="icon gem"></div>99,999<div class="plus">+</div></div>
    <div class="pill" style="flex:.7"><div class="icon energy"></div>1/3<div class="plus">+</div></div>
    <div class="menu-btn"><span></span><span></span><span></span></div>
  </div>

  <div class="title">FISH<br>COLLECTION</div>

  <div class="section" style="top:178px;">
    <div class="sec-head">Boosters</div>
    <div class="boosters">
      <div class="booster"><div class="bowl">🐢</div><div class="timer">10:10:10</div></div>
      <div class="booster"><div class="bowl">🐟</div><div class="timer">10:10:10</div></div>
      <div class="booster"><div class="bowl">🧜‍♀️</div><div class="timer">10:10:10</div></div>
    </div>

    <div class="sec-head">Collection</div>
    <div class="grid">
      <div class="fcard"><div class="art">🐠</div><div class="stars">★</div>
        <div class="foot"><div class="lvl">1</div><div class="count"><b>20/25</b><i></i></div></div></div>
      <div class="fcard"><div class="art">🐡</div><div class="stars">★</div>
        <div class="foot"><div class="lvl">1</div><div class="count"><b>20/25</b><i></i></div></div></div>
      <div class="fcard"><div class="ribbon">NEW</div><div class="art">🐙</div><div class="stars">★</div>
        <div class="foot"><div class="lvl">1</div><div class="count"><b>20/25</b><i></i></div></div></div>
      <div class="fcard"><div class="art">🦄</div><div class="stars">★★</div>
        <div class="foot"><div class="lvl">1</div><div class="count"><b>20/25</b><i></i></div></div></div>
      <div class="fcard"><div class="art">🦀</div><div class="stars">★★</div>
        <div class="foot"><div class="lvl">1</div><div class="count"><b>20/25</b><i></i></div></div></div>
      <div class="fcard"><div class="art">🧜‍♀️</div><div class="stars">★★</div>
        <div class="foot"><div class="lvl">1</div><div class="count"><b>20/25</b><i></i></div></div></div>
    </div>

    <div class="sec-head">To be collected</div>
    <div class="grid">
      <div class="fcard locked"><div class="art">🔒</div><div class="stars" style="color:#B9BDC9;text-shadow:none;">★</div>
        <div class="foot"><div class="lvl" style="background:#9AA0B0;">?</div><div class="count"><b>0/25</b><i style="background:#B9BDC9;"></i></div></div></div>
      <div class="fcard locked"><div class="art">🔒</div><div class="stars" style="color:#B9BDC9;text-shadow:none;">★★</div>
        <div class="foot"><div class="lvl" style="background:#9AA0B0;">?</div><div class="count"><b>0/25</b><i style="background:#B9BDC9;"></i></div></div></div>
      <div class="fcard locked"><div class="art">🔒</div><div class="stars" style="color:#B9BDC9;text-shadow:none;">★★</div>
        <div class="foot"><div class="lvl" style="background:#9AA0B0;">?</div><div class="count"><b>0/25</b><i style="background:#B9BDC9;"></i></div></div></div>
    </div>
  </div>

  <div class="close-btn"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
</body>
</html>
